<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- small upright ears -->
  <path d="M26 34 L30 12 L44 30 Z" fill="#4E5967"/>
  <path d="M74 34 L70 12 L56 30 Z" fill="#4E5967"/>
  <!-- long silky hair falling at sides -->
  <ellipse cx="22" cy="58" rx="10" ry="24" fill="#5E6B7A"/>
  <ellipse cx="78" cy="58" rx="10" ry="24" fill="#5E6B7A"/>
  <!-- head -->
  <circle cx="50" cy="52" r="26" fill="#C08A4E"/>
  <!-- steel-blue crown -->
  <path d="M24 48 Q50 22 76 48 Q50 40 24 48 Z" fill="#5E6B7A"/>
  <!-- muzzle -->
  <ellipse cx="50" cy="64" rx="13" ry="10" fill="#DCA96B"/>
  <!-- eyes -->
  <circle cx="41" cy="51" r="3.3" fill="#2A1F16"/>
  <circle cx="59" cy="51" r="3.3" fill="#2A1F16"/>
  <!-- nose -->
  <ellipse cx="50" cy="60" rx="4.3" ry="3.5" fill="#2A1F16"/>
  <!-- mouth -->
  <path d="M50 63 Q50 68 45.5 68 M50 63 Q50 68 54.5 68" stroke="#2A1F16" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
