  <!-- eyes -->
  <circle cx="38" cy="46" r="3.6" fill="#2E1F12"/>
  <circle cx="62" cy="46" r="3.6" fill="#2E1F12"/>
  <!-- nose -->
  <ellipse cx="50" cy="58" rx="6" ry="4.5" fill="#2E1F12"/>
  <!-- mouth (wide droopy) -->
  <path d="M50 62 Q50 69 41 69 M50 62 Q50 69 59 69" stroke="#7A5A3A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
